name: Auto-tag release

# Triggered by pushes to main. paths-ignore skips Examples/docs/gitignore-only
# pushes — note this also skips pushes that change zero paths (empty commits).
# The bot's bump commit uses [skip ci] so this workflow doesn't loop on itself.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'Examples/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  wait-for-tests:
    name: Wait for Test workflow
    runs-on: ubuntu-latest
    steps:
      # Block the release until the Test workflow's job goes green on THIS sha,
      # so a bad push to main can't auto-tag + publish a broken release. The
      # regexp must match the Test workflow's job name ("Lint + unit tests");
      # single-quoted so the backslash escaping the "+" survives YAML verbatim.
      - name: Wait for lint + unit tests
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-regexp: 'Lint \+ unit tests'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

  tag:
    name: Bump, tag, and publish
    needs: wait-for-tests
    runs-on: ubuntu-latest
    permissions:
      # The job pushes the release commit and the tag back to main.
      contents: write
    # Publishing needs the GPG key + Central Portal credentials. `secrets` is not
    # available in a step-level `if:`, and a step's own `env:` is not reliably
    # visible to that step's `if:` either — so resolve the presence check once
    # here, at the job level, where the whole job's `env` context can see it.
    env:
      HAS_MAVEN_SECRETS: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey != '' && secrets.ORG_GRADLE_PROJECT_mavenCentralUsername != '' }}
      # Single source of truth for the released version: VERSION_NAME is the
      # PUBLISHED Maven coordinate, read by both modules' `mavenPublishing`
      # block, so it is the number the outside world actually consumes.
      VERSION_FILE: gradle.properties
      # The runtime SDK-version constant stamped on every event. It carries no
      # publishing weight of its own, but it MUST move in lockstep with
      # VERSION_NAME or every event reports a version that was never released.
      KOTLIN_VERSION_FILE: pulse-android/src/main/kotlin/org/pubky/pulse/android/PubkyPulseVersion.kt
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version
        id: ver
        run: |
          # gradle.properties' VERSION_NAME is the source of truth for the
          # current version: every release commit writes the released version
          # back into it, so it is never behind the newest tag on main.
          #
          # It is deliberately NOT derived from `git tag -l`. This repository's
          # history descends from an earlier project whose tags climbed into the
          # 0.14.x range and still live on other remotes; a single one of those
          # reaching origin would silently drag the next release up with it.
          # Do not reintroduce a tag-derived version.
          #
          # extract_version quits at the first matching line, so there is no
          # `head` in a pipeline: under `set -o pipefail` a closed pipe would
          # surface as an unexplained step failure.
          extract_version() {
            sed -n -E '/^VERSION_NAME=/{ s/^VERSION_NAME=[[:space:]]*//; s/[[:space:]]+$//; p; q; }'
          }

          current=$(extract_version < "$VERSION_FILE")
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not read a semver version from $VERSION_FILE (got '${current:-<none>}')" >&2
            exit 1
          fi
          IFS='.' read -r MAJ MIN PAT <<< "$current"

          # Pull requests land on main as GitHub merge commits, whose subject is
          # always "Merge pull request #N from owner/branch" — the conventional
          # commit title lives in the body. Reading only %s would therefore make
          # every merge a patch bump, including a breaking "refactor!:" one, so
          # for a merge commit the effective subject is the first non-empty body
          # line. Squash merges and direct commits already carry the prefix in
          # the subject and keep using it. Do not simplify this back to %s.
          subject=$(git log -1 --pretty=%s ${{ github.sha }})
          body=$(git log -1 --pretty=%b ${{ github.sha }})
          full=$(git log -1 --pretty=%B ${{ github.sha }})

          msg="$subject"
          if [[ "$subject" == "Merge pull request #"* || "$subject" == "Merge branch "* ]]; then
            body_line=$(printf '%s\n' "$body" | grep -m1 -v '^[[:space:]]*$' || true)
            if [[ -n "$body_line" ]]; then
              msg="$body_line"
            fi
          fi

          # feat!:/fix!:/BREAKING CHANGE → major; feat:/feat(...) → minor; else patch.
          # BREAKING CHANGE is matched against the full commit message because
          # Conventional Commits puts it in a footer, not in the subject.
          # Pre-1.0 semver convention: while MAJ is 0 the API is unstable, so a
          # breaking marker bumps minor instead of jumping straight to 1.0.0.
          # The first major release happens manually (tag v1.0.0 by hand) — this
          # workflow only takes over once the project is past 0.x.
          if [[ "$msg" == *"!:"* || "$full" == *"BREAKING CHANGE"* ]]; then
            if [[ "$MAJ" == "0" ]]; then
              MIN=$((MIN+1)); PAT=0
            else
              MAJ=$((MAJ+1)); MIN=0; PAT=0
            fi
          elif [[ "$msg" == feat:* || "$msg" == feat\(* ]]; then
            MIN=$((MIN+1)); PAT=0
          else
            PAT=$((PAT+1))
          fi

          version="${MAJ}.${MIN}.${PAT}"
          # Never tag a version that is not strictly above the one in the repo.
          if [[ "$version" == "$current" ]] || \
             [[ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)" != "$version" ]]; then
            echo "Computed version $version is not above $VERSION_FILE version $current" >&2
            exit 1
          fi
          next="v${version}"

          # Rerun safety: if a previous run pushed main but then failed (release
          # creation), main is ahead of the event SHA and the tag is already
          # there. A rerun checks out the same SHA and computes the same version,
          # so the tag is the signal that this release already happened —
          # locally (the checkout fetches tags) or on the remote.
          #
          # The tag EXISTING is not enough on its own. Any tag of that name
          # matches: one left over from earlier history (this repository has
          # plenty), restored from a backup, or created by hand. On such a tag
          # the workflow wedges silently and permanently: "Commit, tag, push" is
          # skipped so the bump never lands on main, main's VERSION_NAME stays
          # at the old value, the next push recomputes the same version, finds
          # the same tag and skips again — and no run ever goes red. Versions
          # simply stop advancing and nothing says so.
          #
          # So only count the tag when it is THIS release's tag, which takes
          # two things. The commit it points at must carry the computed version
          # in VERSION_NAME, which is what the bump commit a genuine rerun looks
          # at does. That on its own is still not enough: a version number is
          # not unique to a commit, and this repository's pre-rename history is
          # full of commits whose VERSION_NAME reads the very version the next
          # release computes, so a stray tag on one of them would satisfy a
          # version-only check and wedge the pipeline exactly as above. The
          # tagged commit must therefore also belong to THIS run: a genuine
          # rerun's bump commit was created directly on top of the checked-out
          # SHA, so its FIRST PARENT is the triggering commit — something no
          # unrelated historical tag can fake. Any other tag leaves the guard
          # false, and the atomic push below then fails loudly because the tag
          # already exists — a visible error a human can act on. Do not simplify
          # this back to bare tag existence, nor to the version match without
          # the first-parent check.
          already_released=false
          tag_ref=""
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            tag_ref="refs/tags/$next"
          elif [[ -n "$(git ls-remote --tags origin "refs/tags/$next")" ]]; then
            # Created after this job's checkout: fetch it so it can be inspected
            # the same way as a tag that was already local.
            git fetch --no-tags origin "refs/tags/$next:refs/tags/$next"
            tag_ref="refs/tags/$next"
          fi

          if [[ -n "$tag_ref" ]]; then
            # A tagged commit with no gradle.properties, or an unparseable one,
            # reads as empty here rather than failing the step.
            tagged_source=$(git show "$tag_ref^{commit}:$VERSION_FILE" 2>/dev/null || true)
            tagged_version=$(printf '%s\n' "$tagged_source" | extract_version)
            # A root commit has no first parent, which reads as empty here
            # rather than failing the step.
            tagged_parent=$(git rev-parse -q --verify "$tag_ref^{commit}^" 2>/dev/null || true)
            if [[ "$tagged_version" == "$version" && "$tagged_parent" == "${{ github.sha }}" ]]; then
              already_released=true
            else
              reason=""
              if [[ "$tagged_version" != "$version" ]]; then
                reason="VERSION_NAME at that tag says '${tagged_version:-<none>}', not $version"
              fi
              if [[ "$tagged_parent" != "${{ github.sha }}" ]]; then
                if [[ -n "$reason" ]]; then
                  reason="$reason, and "
                fi
                reason="${reason}the tagged commit is not a child of this run's commit ${{ github.sha }} (its first parent is '${tagged_parent:-<none>}')"
              fi
              echo "::warning::Tag $next already exists but $reason, so it is not this release. Not skipping the release steps; the tag push will fail loudly if that tag is in the way."
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "already_released=$already_released" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (from '$msg'), already released: $already_released"

      # Skipped when the tag already exists, which is what a rerun of a
      # partially-failed release looks like: main already carries the bump
      # commit, so committing and pushing again would fail non-fast-forward and
      # strand the release. The release step below has its own skip-if-exists
      # guard, so a rerun completes only the parts that are missing.
      - name: Commit, tag, push
        if: ${{ steps.ver.outputs.already_released != 'true' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          # Both files hold plain semver, with no leading "v", and they move
          # together. VERSION_NAME is the PUBLISHED Maven coordinate
          # (mavenPublishing reads it): if it does not bump, every release after
          # the first re-publishes the same version and Central rejects the
          # duplicate, silently breaking the pipeline. CURRENT is the runtime
          # SDK identity stamped on every event, so leaving it behind makes
          # every event report a version that was never released.
          sed -i -E "s/^(VERSION_NAME=).*/\1$VERSION/" "$VERSION_FILE"
          written=$(sed -n -E '/^VERSION_NAME=/{ s/^VERSION_NAME=[[:space:]]*//; s/[[:space:]]+$//; p; q; }' "$VERSION_FILE")
          if [[ "$written" != "$VERSION" ]]; then
            echo "Failed to write $VERSION into $VERSION_FILE (it now reads '${written:-<none>}')" >&2
            exit 1
          fi

          sed -i -E "s/(public const val CURRENT: String = )\"[^\"]*\"/\1\"$VERSION\"/" "$KOTLIN_VERSION_FILE"
          written=$(sed -n -E '/public const val CURRENT: String = /{ s/.*= "([^"]*)".*/\1/p; q; }' "$KOTLIN_VERSION_FILE")
          if [[ "$written" != "$VERSION" ]]; then
            echo "Failed to write $VERSION into $KOTLIN_VERSION_FILE (it now reads '${written:-<none>}')" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VERSION_FILE" "$KOTLIN_VERSION_FILE"
          git commit -m "chore: release $NEXT [skip ci]"
          git tag "$NEXT"
          # --atomic is load-bearing: the branch and the tag move together or
          # not at all. The rerun guard above keys on the tag existing, so a
          # push that landed the bump commit on main without the tag would make
          # that guard lie — the rerun would not skip, would build a second bump
          # commit on the original SHA, and would die non-fast-forward with the
          # release stranded. Do not split these back into two pushes.
          git push --atomic origin main "$NEXT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          # Retry `gh release create`, skipping if the release already exists —
          # the tag push is already durable at this point, so a transient API
          # failure must not leave a tagged commit with no release.
          for i in 1 2 3; do
            if gh release view "$NEXT" >/dev/null 2>&1; then
              echo "Release $NEXT already exists, skipping"
              exit 0
            fi
            if gh release create "$NEXT" --title "$NEXT" --generate-notes; then
              exit 0
            fi
            echo "gh release create attempt $i failed; sleeping 15s..."
            sleep 15
          done
          echo "Failed to create release after 3 attempts"
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Publish both library modules to Maven Central. Uses the vanniktech
      # maven-publish plugin's one-shot task, which stages + closes + releases
      # to the Central Portal. Credentials + GPG key are read from the
      # ORG_GRADLE_PROJECT_* env vars (the plugin's standard property names):
      #   signingInMemoryKey         — ASCII-armored GPG private key
      #   signingInMemoryKeyPassword — its passphrase
      #   mavenCentralUsername       — Central Portal token username
      #   mavenCentralPassword       — Central Portal token password
      # Gated on HAS_MAVEN_SECRETS (computed at the job level) so forks and
      # pre-config pushes tag-and-release without failing on a missing credential.
      # --no-configuration-cache: the publish/signing tasks aren't
      # configuration-cache safe, and the repo enables it by default in
      # gradle.properties.
      - name: Publish to Maven Central
        if: ${{ env.HAS_MAVEN_SECRETS == 'true' }}
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
